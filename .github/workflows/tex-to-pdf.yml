name: Compile LaTeX files and Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - Dockerfile
      - .github/workflows/build-docker.yml
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/tex-action:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile LaTeX documents
        shell: bash
        run: |
          set -euo pipefail
          command -v pdflatex
          mkdir -p output
          for file in *.tex; do
            pdflatex -interaction=nonstopmode -halt-on-error -output-directory output "$file"
          done

      - name: Convert PDF to DOCX
        shell: bash
        run: |
          set -euo pipefail
          command -v soffice
          cd output
          for pdf in *.pdf; do
            soffice --headless --infilter='writer_pdf_import' --convert-to docx --outdir . "$pdf"
          done
          ls -lh ./*.pdf ./*.docx

      - name: Create Release and Upload Artifacts
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          command -v git
          command -v gh
          TAG_NAME="release-$(date +'%Y%m%d%H%M%S')"
          gh release create "$TAG_NAME" ./output/*.pdf ./output/*.docx \
            --repo "$GITHUB_REPOSITORY" \
            --title "Release $TAG_NAME" \
            --notes "Automated release of compiled PDF and DOCX documents" \
            --draft
